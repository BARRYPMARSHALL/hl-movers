name: refresh intraday

# 1h/4h need one candle request per market (178 of them). Measured against the public API: ~2.5s
# per request, ~2 req/s sustainable, 2.5 req/s throttled. Doing that in every visitor's browser
# earns every visitor a 429, so one scheduled sweep pays the cost and writes a small static file
# that the page reads. Price / 24h / volume / OI stay live — the page calls the info API itself.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-intraday
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sweep 1h/4h for every market
        run: node tools/snapshot.js data.json

      - name: Commit if the data moved
        run: |
          if git diff --quiet -- data.json; then
            echo "no change"
            exit 0
          fi
          git config user.name "hl-movers bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git commit -m "data: intraday snapshot $(date -u '+%Y-%m-%d %H:%MZ')"
          git push
